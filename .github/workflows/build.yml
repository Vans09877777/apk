name: Build Floating Launcher APK

on:
  push:
    paths:
      - 'FloatingLauncher.zip'
      - '.github/workflows/build-floating-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: |
          unzip -q FloatingLauncher.zip -d work
          ls work/FloatingLauncher

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner ubuntu-latest, jadi tidak perlu setup-android.
      - name: Terima lisensi Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: work/FloatingLauncher
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingLauncher-debug-apk
          path: work/FloatingLauncher/app/build/outputs/apk/debug/*.apk
          
